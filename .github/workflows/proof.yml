name: Lean proof and native baseline
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  linux-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the pinned Lean toolchain (elan)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean/lean-toolchain)"
      - name: Cold build, axiom audit and generated-file checks in a bounded cgroup
        shell: bash
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" \
            --property=MemoryMax=7500000000 --property=MemorySwapMax=0 \
            --property=CPUQuota=800% --property=TasksMax=512 \
            --working-directory="$GITHUB_WORKSPACE" \
            --setenv=HOME="$HOME" --setenv=PATH="$HOME/.elan/bin:$PATH" \
            --setenv=GITHUB_ACTIONS=true \
            bash validation/ci/linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-proof-log
          if-no-files-found: ignore
          path: lake-build.log
  windows-native:
    # Compile-only MSBuild baseline of native/*.vcxproj (v143 on hosted runners; v145 is validated on the author's machine).
    # GMP for rsa comes from native/gmp.props (Conan); a failed dependency resolution is reported, not hidden.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Preserve exact source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: MSBuild projects, Debug x64 (v143, compile only)
        shell: pwsh
        run: |
          python validation/native.py --toolset v143
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Nothing outside build outputs may have been written
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain
  linux-native:
    # Compile-only baseline of the reference C++ (plan R0 step 8); nothing is run here.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: g++ -std=c++17 native/selfmodgraph.cpp native/IrredLoop.cpp
        run: g++ -std=c++17 -c native/selfmodgraph.cpp -o /tmp/selfmodgraph.o && g++ -std=c++17 -c native/IrredLoop.cpp -o /tmp/IrredLoop.o
