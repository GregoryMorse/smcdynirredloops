name: drivers

# Native AES / RSA / ECDSA drivers (plan R21a G37, R16b G07): the C VM sources are generated by python/, the drivers are built
# with CMake (SMC_BUILD_DRIVERS) and run on a hosted Windows runner (they use QueryPerformanceCounter and AES-NI). The timing
# logs are uploaded as artifacts; they are measurements (evidence class M), not proofs, and depend on the hosted machine.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drivers:
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Preserve exact source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Generate the C VM sources (RSA 32..256, AES 128/192/256, ECDSA)
        shell: pwsh
        run: |
          python -m pip install pycryptodome
          $env:SMCIRRED_RSA_MAX_BITS = '256'
          python python/rsa.py
          python python/aes.py
          python python/ecdsab.py
          # the straight-line graph variant of AES-128 has no emitter (L09); the driver links a stub with the same symbol
          Set-Content -Path generated/aesgraph.c -Value 'void AES_128_obf_encrypt(unsigned char* out, unsigned char* in) {}'
          Get-ChildItem generated | Select-Object Name, Length
      - name: GMP 6.2.1-4 (ShiftMediaProject prebuilt for VS2022, hash-pinned)
        shell: pwsh
        run: |
          $url = 'https://github.com/ShiftMediaProject/gmp/releases/download/6.2.1-4/libgmp_6.2.1-4_msvc17.zip'
          Invoke-WebRequest $url -OutFile gmp.zip
          if ((Get-FileHash gmp.zip -Algorithm SHA256).Hash -ne '2FFDD5FA3F43128D5832C471F9E17B4F189B0B98700A4DAFEC3AFB9A1F50BA2F') { throw 'GMP archive hash mismatch' }
          Expand-Archive gmp.zip -DestinationPath native/deps/gmp
      - name: Configure and build (Release)
        shell: pwsh
        run: |
          cmake -S . -B build/cmake -DSMC_BUILD_DRIVERS=ON -DGMP_ROOT="$PWD/native/deps/gmp" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cmake --config Release 2>&1 | Tee-Object -FilePath build-drivers.log
      - name: Run the drivers
        shell: pwsh
        run: |
          $env:PATH = "$PWD/native/deps/gmp/bin/x64;$env:PATH"
          $bin = 'build/cmake/bin/Release'
          if (-not (Test-Path $bin)) { $bin = 'build/cmake/bin' }
          foreach ($d in 'aes', 'ecdsa', 'rsa') { cmd /c "build\cmake\bin\Release\$d.exe < NUL > run-$d.log 2>&1"; "$d exit $LASTEXITCODE" | Tee-Object -Append run-status.log }
          Get-Content run-*.log | Select-String -Pattern 'seconds|Encryption|Decryption|Sign' | Select-Object -First 200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: driver-logs
          if-no-files-found: ignore
          path: |
            build-drivers.log
            run-*.log
