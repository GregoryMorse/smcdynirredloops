name: drivers-portable

# The AES / RSA / ECDSA drivers on Linux and macOS (Intel and arm64), built with CMake (SMC_BUILD_DRIVERS) from the C sources that
# python/ generates (Windows: drivers.yml). SMC_ITERATIONS lowers the timing loops (portability test, not a benchmark): the AES
# driver prints "0 0 0" for every self-check (AES-128/192/256: reference, intrinsics where available, graph and VM variants).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drivers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: GMP
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libgmp-dev; else brew install gmp; fi
      - name: Generate the C sources
        run: |
          python -m pip install pycryptodome
          SMCIRRED_RSA_MAX_BITS=256 python python/rsa.py
          python python/aes.py
          python python/ecdsab.py
          ls -l generated
      - name: Configure and build
        run: |
          cmake -S . -B build/cmake -DSMC_BUILD_DRIVERS=ON -DCMAKE_BUILD_TYPE=Release
          set -o pipefail
          cmake --build build/cmake --config Release -j 2 2>&1 | tee build-drivers.log
      - name: Run the drivers
        run: |
          export SMC_ITERATIONS=2
          for d in aes rsa ecdsa; do
            status=0
            ./build/cmake/bin/$d < /dev/null > run-$d.log 2>&1 || status=$?
            echo "$d exit $status" | tee -a run-status.log
            tail -n 40 run-$d.log
          done
          ! grep -q "exit [1-9]" run-status.log
          test "$(grep -c '^0 0 0$' run-aes.log)" = 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: driver-logs-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            build-drivers.log
            run-*.log
